<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบหลังบ้าน ค่าธรรมเนียมขยะ</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
:root{--g:#1b7f4b;--gd:#145c37;--gl:#e3f2e8;--bg:#f2f7f3;--tx:#1d2b22;--mu:#5f6f65;--card:#fff;--bd:#d5e3d9;--er:#c62828;--am:#d4a017;--ok:#1b7f3b}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:var(--gd)}
header{background:var(--g);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:1100}
header .t{font-weight:700;font-size:1.05rem}
header .u{font-size:.85rem;text-align:right}
header button{background:none;border:1px solid #fff;color:#fff;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
#burger{display:none}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav{width:220px;background:#fff;border-right:1px solid var(--bd);padding:10px 0;flex:none}
nav a{display:block;padding:10px 18px;text-decoration:none;color:var(--tx)}
nav a.on{background:var(--gl);color:var(--gd);font-weight:700;border-left:4px solid var(--g)}
main{flex:1;min-width:0;padding:14px;max-width:1200px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:1.3rem}h3{margin:0 0 8px;font-size:1.05rem}
.muted{color:var(--mu);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.grid label{display:block;font-size:.85rem;color:var(--mu)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;padding:0}
textarea{min-height:110px}
button.btn{padding:9px 16px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
button.btn.sec{background:#fff;color:var(--gd);border:1px solid var(--g)}
button.btn.red{background:var(--er)}
button.btn.sm{padding:3px 10px;font-size:.85rem}
button.btn:disabled{background:#a9bfb1;cursor:not-allowed}
button.btn.full{width:100%;margin-top:6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--gl);white-space:nowrap}th.s{cursor:pointer}
td.n,th.n{text-align:right}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.8rem;color:#fff;background:#888;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:1.3rem;color:var(--gd)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chart{position:relative;height:280px}
.err{color:var(--er);margin:6px 0}
.ok{background:var(--gl);color:var(--gd);padding:10px;border-radius:8px;margin:8px 0}
.warn{background:#fff6dd;color:#7a5b00;padding:10px;border-radius:8px;margin:8px 0}
.amt{font-size:1.4rem;font-weight:700;color:var(--gd)}
.opt{display:flex;align-items:flex-start;gap:8px;padding:5px 0;cursor:pointer}
.opt input{margin-top:5px;flex:none}
.sep{border-top:1px dashed var(--bd);margin-top:8px;padding-top:6px}
.diff del{color:var(--er)}.diff ins{color:var(--ok);text-decoration:none;font-weight:600}
.minimap{height:260px;border-radius:8px;margin:8px 0}
.bigmap{height:calc(100vh - 230px);min-height:380px;border-radius:8px}
.legend span{margin-right:12px;white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px}
.login{max-width:360px;margin:8vh auto;padding:0 12px}
.hide{display:none!important}
#print{display:none}
@media(max-width:800px){
 #burger{display:inline-block}
 .layout{display:block}
 nav{display:none;position:fixed;top:52px;left:0;right:0;z-index:1050;border-right:0;border-bottom:2px solid var(--g);max-height:75vh;overflow:auto}
 nav.open{display:block}
 main{padding:10px}
 .bigmap{height:calc(100vh - 290px)}
}
@media print{body>*:not(#print){display:none!important}#print{display:block;padding:16px;color:#000;background:#fff;font-size:14pt}#print h2,#print p{margin:4px 0}#print hr{border:0;border-top:1px dashed #000}#print section{page-break-after:always}}
</style>
</head>
<body>
<div id="root"></div>
<div id="print"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/chart.js/chart.umd.js"></script>
<script src="app.js"></script>
<script src="pages/dashboard.js"></script>
<script src="pages/houses.js"></script>
<script src="pages/counter.js"></script>
<script src="pages/map.js"></script>
<script src="pages/admin.js"></script>
<script>App.start();</script>
</body>
</html>
